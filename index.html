<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLOPVISION NETWORK DASHBOARD</title>

  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <!-- Converge/Gallopvision Teal Theme Color -->
  <meta name="theme-color" content="#0d8a80">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --primary-teal: #0d8a80;
      --dark-charcoal: #212529;
      --light-bg: #f8f9fa;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--light-bg);
      display: flex;
      flex-direction: column;
    }

    /* App Header Branding */
    .app-header {
      background-color: #ffffff;
      border-bottom: 3px solid var(--primary-teal);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 10;
    }

    .brand-title {
      color: var(--dark-charcoal);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--primary-teal);
    }

    .refresh-btn {
      background-color: var(--primary-teal);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:active {
      background-color: #085f58;
    }

    /* Container para sa Embedded Sheet */
    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Top Header bar with Gallopvision | Converge Palette -->
  <header class="app-header">
    <div class="brand-title">
      GALLOPVISION <span>| CONVERGE</span>
    </div>
    <button class="refresh-btn" onclick="refreshReport()">REFRESH</button>
  </header>

  <!-- Google Sheet Embed -->
  <div class="iframe-container">
    <iframe id="reportFrame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSRVakF5GCBFh4HridCtcz6vQ9mYbH6zLfM0vEGbgC9lQKG-429i03Sgmd2cCsLNSxQ98ZeiWSYediR/pubhtml?widget=true&amp;headers=false"></iframe>
  </div>

  <script>
    // Refresh function para sa dynamic Google Sheet update
    function refreshReport() {
      const iframe = document.getElementById('reportFrame');
      iframe.src = iframe.src;
    }

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered!'))
          .catch(err => console.error('Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
