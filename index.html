<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALLOPVISION NETWORK DASHBOARD</title>

  <!-- Resource Hints -->
  <link rel="preconnect" href="https://docs.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://docs.google.com">

  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d8a80">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --primary-teal: #0d8a80;
      --dark-charcoal: #212529;
      --light-bg: #f8f9fa;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--light-bg);
      display: flex;
      flex-direction: column;
    }

    /* App Header Branding */
    .app-header {
      background-color: #ffffff;
      border-bottom: 3px solid var(--primary-teal);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      z-index: 10;
    }

    .brand-title {
      color: var(--dark-charcoal);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--primary-teal);
    }

    .refresh-btn {
      background-color: var(--primary-teal);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:active {
      background-color: #085f58;
    }

    /* Container para sa Embedded Sheet */
    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* FORCE LOADER OVERLAY TO BE VISIBLE BY DEFAULT */
    .loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999; /* Pinakamataas na layer */
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* Class na magtatago sa loader */
    .loader-overlay.fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #e0e0e0;
      border-top: 5px solid var(--primary-teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--dark-charcoal);
      letter-spacing: 0.5px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Top Header bar -->
  <header class="app-header">
    <div class="brand-title">
      GALLOPVISION <span>| CONVERGE</span>
    </div>
    <button class="refresh-btn" onclick="refreshReport()">REFRESH</button>
  </header>

  <div class="iframe-container">
    <!-- Loader Overlay (Naka-unang pwesto bago ang iframe) -->
    <div id="loadingOverlay" class="loader-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Fetching latest report data...</div>
    </div>

    <iframe 
      id="reportFrame" 
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSRVakF5GCBFh4HridCtcz6vQ9mYbH6zLfM0vEGbgC9lQKG-429i03Sgmd2cCsLNSxQ98ZeiWSYediR/pubhtml?widget=false&amp;headers=false&amp;chrome=false">
    </iframe>
  </div>

  <script>
    const loader = document.getElementById('loadingOverlay');
    const iframe = document.getElementById('reportFrame');

    function showLoader() {
      loader.classList.remove('fade-out');
    }

    function hideLoader() {
      loader.classList.add('fade-out');
    }

    // Makikinig sa mismong load event ng iframe sa pamamagitan ng JS Event Listener
    iframe.addEventListener('load', () => {
      // Maglalagay ng kaunting delay (500ms) para siguradong na-render na ang Google Sheet visual elements
      setTimeout(() => {
        hideLoader();
      }, 500);
    });

    function refreshReport() {
      showLoader();
      const baseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSRVakF5GCBFh4HridCtcz6vQ9mYbH6zLfM0vEGbgC9lQKG-429i03Sgmd2cCsLNSxQ98ZeiWSYediR/pubhtml";
      iframe.src = `${baseUrl}?widget=false&headers=false&chrome=false&t=${new Date().getTime()}`;
    }

    // Auto-refresh kada 1 minuto
    setInterval(() => {
      refreshReport();
    }, 60000);

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered!'))
          .catch(err => console.error('Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
